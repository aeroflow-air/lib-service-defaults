# Publishes both nupkgs to GitHub Packages when a v* tag is pushed.
# Version is the tag without the leading v (for example v0.1.0 -> 0.1.0).
# Uses GITHUB_TOKEN (packages: write). Do not log the token.

name: Publish

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read
  packages: write

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"

      - name: Read version from tag
        id: version
        run: |
          tag="${GITHUB_REF_NAME}"
          version="${tag#v}"
          if ! [[ "${version}" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]]; then
            echo "Tag ${tag} is not a valid vMAJOR.MINOR.PATCH version."
            exit 1
          fi
          echo "version=${version}" >> "${GITHUB_OUTPUT}"

      - name: Test
        run: >
          dotnet test AeroFlow.ServiceDefaults.sln
          --configuration Release
          -p:Version=${{ steps.version.outputs.version }}
          -p:PackageVersion=${{ steps.version.outputs.version }}

      - name: Pack
        run: >
          dotnet pack AeroFlow.ServiceDefaults.sln
          --configuration Release
          --no-build
          --output artifacts
          -p:Version=${{ steps.version.outputs.version }}
          -p:PackageVersion=${{ steps.version.outputs.version }}

      - name: Push to GitHub Packages
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: >
          dotnet nuget push artifacts/*.nupkg
          --api-key "${GITHUB_TOKEN}"
          --source "https://nuget.pkg.github.com/aeroflow-air/index.json"
          --skip-duplicate
